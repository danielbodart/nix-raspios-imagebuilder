# All of danielbodart's flakes move their locks in one window a week, Sunday
# 21:23 UTC, and the NixOS config that takes them follows two hours later, so
# they all land on the same nixpkgs: a security fix reaches every machine
# within the week, a machine carries one nixpkgs rather than one per flake,
# and danielbodart.cachix.org already holds what the config asks for.
#
# The new lock is committed only if `nix flake check` passes with it: the
# apps built and shellchecked, and an image evaluated through every module.
# Not an image built -- that needs a package lock and root, and an aarch64
# builder or KVM, and nixpkgs gives it only the tools that drive mmdebstrap.
name: Bump the flake's inputs
on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flake-lock
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Pushes what the check builds. Without the secret it only substitutes.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Update the inputs, check the flake, and commit and push when one moved
        run: |
          nix flake update 2>&1 | tee update.log
          git diff --quiet flake.lock && { echo "Nothing moved."; exit 0; }
          moved=$(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2 | paste -sd, - | sed 's/,/, /g')
          nix flake check --print-build-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Bump the flake's inputs: ${moved:-flake.lock}" flake.lock
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk
